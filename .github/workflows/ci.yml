name: CI

# Runs on every push to any branch and on every pull request into main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: python -m pytest -q

  # The frontend job (eslint, vitest, build) is added when Area B's
  # React app is merged into main.
